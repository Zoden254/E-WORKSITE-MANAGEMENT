{% extends "master.html" %}

{% block title %}Login{% endblock title %}

{% block content %}

{% include "nav.html" %}

<div class="w-full h-100 flex justify-center items-center">
    <form class="flex-col [&>input]:m-2 [&>input]:rounded-2xl [&>input]:p-2 flex [&>label]:font-bold " method="POST" >
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" name="username"><br>

        <label for="password">Password</label>
        <input type="password" name="password"><br>

        <button type="submit" class="border bg-black text-white p-2 rounded-2xl hover:bg-white hover:text-black">Login</button>
    </form>
</div>

{% endblock content %}
